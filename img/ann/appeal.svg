<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Masjid extension appeal progress">
  <defs>
    <pattern id="girih-appeal" width="150" height="150" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A227" stroke-width="1.6" opacity="0.18">
        <polygon points="75,10 96,54 144,61 109,95 117,143 75,120 33,143 41,95 6,61 54,54"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#06081f"/>
  <rect width="1200" height="675" fill="url(#girih-appeal)"/>
  <text x="120" y="180" fill="#C9A227" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" letter-spacing="10">BUILDING APPEAL</text>
  <text x="120" y="272" fill="#F5F0E1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="700">Halfway there</text>
  <!-- progress bar -->
  <rect x="120" y="340" width="960" height="46" fill="none" stroke="#C9A227" stroke-width="4"/>
  <rect x="128" y="348" width="476" height="30" fill="#C9A227"/>
  <text x="120" y="440" fill="#F5F0E1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="600">£50,000 raised of £100,000</text>
  <text x="120" y="510" fill="#F5F0E1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="400" opacity="0.8">New prayer hall, madrassa rooms and lift access</text>
  <g fill="none" stroke="#C9A227" stroke-width="3" opacity="0.75">
    <rect x="880" y="470" width="200" height="120"/>
    <path d="M880 470 L980 400 L1080 470"/>
    <rect x="950" y="530" width="60" height="60"/>
  </g>
</svg>
