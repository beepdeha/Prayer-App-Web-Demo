  <text x="600" y="220" text-anchor="middle" fill="#C9A227" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" letter-spacing="12">FRIDAY SUNNAH</text>
  <text x="600" y="330" text-anchor="middle" fill="#F5F0E1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="700">Surah Al-Kahf</text>
