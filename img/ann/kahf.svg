  <defs>
    <pattern id="girih-kahf" width="150" height="150" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A227" stroke-width="1.6" opacity="0.2">
        <polygon points="75,10 96,54 144,61 109,95 117,143 75,120 33,143 41,95 6,61 54,54"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#06081f"/>
