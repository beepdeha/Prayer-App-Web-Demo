<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Madrassa enrolment open for September">
  <defs>
    <pattern id="girih-mad" width="150" height="150" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A227" stroke-width="1.6" opacity="0.16">
        <rect x="37" y="37" width="76" height="76"/>
        <rect x="37" y="37" width="76" height="76" transform="rotate(45 75 75)"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#0A1247"/>
  <rect width="1200" height="675" fill="url(#girih-mad)"/>
  <text x="120" y="170" fill="#C9A227" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" letter-spacing="10">MADRASSA</text>
  <text x="120" y="266" fill="#F5F0E1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="700">Enrolment open</text>
  <rect x="120" y="306" width="220" height="5" fill="#C9A227"/>
  <text x="120" y="384" fill="#F5F0E1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="600" opacity="0.92">September intake · Ages 5–15</text>
  <text x="120" y="452" fill="#F5F0E1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="400" opacity="0.78">Qaidah · Nazirah · Hifz · Islamic studies</text>
  <text x="120" y="546" fill="#C9A227" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600">Forms available at the masjid office</text>
  <!-- open book motif -->
  <g fill="none" stroke="#C9A227" stroke-width="4" opacity="0.85">
    <path d="M840 300 Q940 268 1030 300 L1030 470 Q940 438 840 470 Z"/>
    <path d="M1030 300 Q1120 268 1130 300 L1130 470 Q1120 438 1030 470 Z" transform="translate(-10,0)"/>
    <line x1="1030" y1="300" x2="1030" y2="470"/>
  </g>
</svg>
